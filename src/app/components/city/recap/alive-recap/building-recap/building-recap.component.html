<div class="building" [style.--c]="building.rarity | rarityToColor">
  <span class="tier" [title]="building.rarity"></span>
  <div class="body">
    <div class="row">
      <app-building-emblem [id]="building.id" [size]="26" />
      <span class="name">{{ building.name }}</span>
      @if (building.rank > 0) {
        <app-rank-pips [rank]="building.rank" [max]="cityService.defaultValues().rank_rules.max_rank" />
      }
      @if (building.recycled) {
        <span class="neon-chip recycled" style="--c: var(--cyan)" title="Back from the draw pile"
          ><app-icon name="recycle" [size]="12" />+{{ building.lvl_max - building.lvl }} lvl</span
        >
      }
      @if (building.effect; as effect) {
        <app-effect-tooltip
          [effect]="effect"
          [day]="cityService.city().day"
          [rank]="building.rank"
          [withDefenseBonus]="true"
        />
      } @else {
        <span class="def"><app-icon name="shield" [size]="13" />{{ building.defense | formatNumber }}</span>
      }
    </div>
    <app-building-recap-inventory-inventory [building]="building"></app-building-recap-inventory-inventory>
    <div class="row meta">
      <span><app-icon name="clock" [size]="13" />{{ getTimeBuildingString() }}</span>
      <span><app-icon name="trend" [size]="13" />{{ building.lvl }}/{{ building.lvl_max }}</span>
    </div>
  </div>
</div>
