<div class="recap">
  <div class="scroll">
    <app-recap-radar
      [defense]="cityService.city().attackRecap.defense"
      [zombies]="cityService.city().attackRecap.nb_zb"
      [night]="cityService.city().day - 1"
      [blips]="blipColors()"
    />

    <app-night-log [events]="nightEvents()" />

    @if (nbMaxChoices() > 0) {
      <section class="neon-card">
        <h2 class="label">{{ 'recap.architectPick' | t: { pick: nbMaxChoices(), total: nbChoicesAvailable() } }}</h2>
        @for (building of architectBuildings(); track $index) {
          <label class="pick" [class.selected]="selectedBuildings().has($index)">
            <input
              type="checkbox"
              [checked]="selectedBuildings().has($index)"
              (change)="toggleBuilding($event, $index)"
            />
            <app-building-recap [building]="building"></app-building-recap>
          </label>
        }
      </section>
    }
  </div>

  <div class="footer">
    <button type="button" class="cta" (click)="startDay()">
      <app-icon name="play" [size]="22" />{{ 'recap.startDay' | t: { day: cityService.city().day } }}
    </button>
  </div>
</div>
