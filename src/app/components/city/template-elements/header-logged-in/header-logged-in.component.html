<div class="top-bar">
  @if (authService.isConnected()) {
    <div class="balance" [attr.aria-label]="money() + ' coins'">
      <span class="balance-icon"><app-icon name="money" [size]="18" /></span>
      <span class="balance-amount">{{ money() }}</span>
      <span class="balance-unit">coins</span>
    </div>
    @if (authService.tempAccount()) {
      <span class="no-cloud-save">no cloud<br />save</span>
    }
  }
  <div class="spacer"></div>
  <a class="icon-btn" href="https://discord.gg/qFnSBa8P9Z" target="_blank" rel="noopener" aria-label="Discord">
    <app-icon name="discord" />
  </a>
  <button
    #moreButton
    type="button"
    class="icon-btn more-btn"
    [class.active]="menuOpen() || menuLinkActive()"
    aria-label="More"
    aria-haspopup="menu"
    [attr.aria-expanded]="menuOpen()"
    cdkOverlayOrigin
    #moreOrigin="cdkOverlayOrigin"
    (click)="toggleMenu()"
  >
    <app-icon name="more" />
  </button>
  <ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="moreOrigin"
    [cdkConnectedOverlayOpen]="menuOpen()"
    [cdkConnectedOverlayPositions]="menuPositions"
    (overlayOutsideClick)="closeMenuOutside($event, moreButton)"
    (detach)="closeMenu()"
  >
    <nav class="more-menu" role="menu">
      @for (link of links(); track link.label) {
        <a
          class="more-item"
          role="menuitem"
          [routerLink]="link.link"
          [queryParams]="link.queryParams"
          routerLinkActive="active"
          (click)="closeMenu()"
        >
          <app-icon [name]="link.icon" />
          {{ link.label }}
        </a>
      }
    </nav>
  </ng-template>
</div>
