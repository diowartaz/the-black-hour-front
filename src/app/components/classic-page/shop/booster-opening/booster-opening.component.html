<div class="backdrop" role="dialog" aria-modal="true" [attr.aria-label]="boosterName() + ' booster'">
  <div #panel class="panel">
    <h2 class="neon-title" style="--glow: var(--yellow)">{{ boosterName() }} booster</h2>
    <div class="cards">
      @for (card of shownCards(); track $index) {
        @let isRevealed = $index < revealed() && !!card.building;
        <div
          class="slot"
          [class.revealed]="isRevealed"
          [style.--rarity]="card.rarity | rarityToColor"
          [style.--delay]="(delays()[$index] ?? 0) + 'ms'"
        >
          @if (card.building) {
            <div class="front">
              @if (card.is_new) {
                <span class="neon-chip badge" style="--c: var(--green)">New</span>
              }
              <span class="neon-chip copies" style="--c: var(--yellow)" [style.--copies]="card.copies"></span>
              <app-building-card [building]="card.building" [count]="card.count" />
            </div>
          }
          <button
            type="button"
            class="hidden-card"
            aria-label="Reveal the next plan"
            [attr.inert]="isRevealed ? '' : null"
            (click)="reveal($index)"
          >
            <app-icon name="sparkle" [size]="32" />
          </button>
          @if (isRevealed) {
            <span class="impact" aria-hidden="true">
              <span class="wave"></span>
              @for (grain of card.impact.dust; track $index) {
                <i class="dust" [style]="grain"></i>
              }
            </span>
          }
        </div>
      }
    </div>
    <div class="actions">
      @if (!allRevealed()) {
        <button type="button" class="ghost-btn" (click)="revealAll()">Reveal all</button>
      } @else {
        <button
          type="button"
          class="ghost-btn"
          style="--c: var(--yellow)"
          [disabled]="!canOpenAnother() || cityService.openBoosterLoading()"
          (click)="again()"
        >
          <app-icon name="refresh" [size]="16" />Open another
        </button>
        <button type="button" class="ghost-btn" (click)="closed.emit()">Done</button>
      }
    </div>
  </div>
</div>
