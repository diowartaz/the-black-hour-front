<div
  class="game"
  [class.win]="game.outcome === 'win'"
  [class.loss]="game.outcome === 'loss'"
  [class.draw]="game.outcome === 'draw'"
>
  <div class="game-head">
    <span class="neon-chip" [style.--c]="game.ranked ? 'var(--yellow)' : 'var(--cyan)'">
      {{ (game.ranked ? 'game.ranked' : 'game.normal') | t }}
    </span>
    @if (game.outcome !== null) {
      <span class="result"
        >{{ 'game.' + game.outcome | t }}{{ game.forfeit ? ('game.forfeit' | t) : '' }}
        @if (game.win_money > 0) {
          <span class="win-money" [title]="'game.victoryBonus' | t"
            ><app-icon name="money" [size]="14" />+{{ game.win_money | formatNumber }}</span
          >
        }
      </span>
    }
  </div>
  <app-subgame
    [gameHistoryPlayer]="game.player1"
    [outcome]="game.outcome"
    [ranked_points]="game.ranked_points"
    [otherPlayer]="false"
  >
  </app-subgame>
  @if (game.ranked) {
    <app-subgame
      [gameHistoryPlayer]="game.player2"
      [outcome]="opponentOutcome()"
      [ranked_points]="game.ranked_points"
      [otherPlayer]="true"
    >
    </app-subgame>
  }
</div>
